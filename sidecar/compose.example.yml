services:
  linuxdo-auth-sidecar:
    build:
      context: ..
      dockerfile: sidecar/Dockerfile
      target: runtime
    container_name: linuxdo-auth-sidecar
    restart: unless-stopped
    init: true
    user: "1000"
    shm_size: 512mb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LINUXDO_SECRET_FILE: /run/secrets/astrbot_plugin_linuxdo_preview.json
      LINUXDO_SESSION_STATE_FILE: /run/session/linuxdo-storage-state.json
      LINUXDO_BYPARR_TIMEOUT_SECONDS: "40"
      LINUXDO_BROWSER_REQUEST_TIMEOUT_SECONDS: "30"
      PROXY_SERVER: http://host.docker.internal:7890
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,linuxdo-auth-sidecar
      BROWSER_LOCALE: zh-CN
      STEALTHFOX_GEOIP_MMDB: /opt/byparr/geoip/geoip-aio-all.mmdb
    volumes:
      - ${LINUXDO_GEOIP_MMDB_FILE:?set LINUXDO_GEOIP_MMDB_FILE}:/opt/byparr/geoip/geoip-aio-all.mmdb:ro
      - /AstrBot/data/secrets/astrbot_plugin_linuxdo_preview.json:/run/secrets/astrbot_plugin_linuxdo_preview.json:ro
      - ./runtime/session:/run/session
    networks:
      - astrbot

  linuxdo-auth-bootstrap:
    profiles:
      - bootstrap
    build:
      context: ..
      dockerfile: sidecar/Dockerfile
      target: runtime
    container_name: linuxdo-auth-bootstrap
    restart: "no"
    init: true
    user: "1000"
    shm_size: 512mb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LINUXDO_ENTRYPOINT_MODULE: sidecar.device_authorize
      LINUXDO_DEVICE_MODE: start
      LINUXDO_DEVICE_REQUEST_FILE: /run/bootstrap/device-request.json
      LINUXDO_DEVICE_RESPONSE_FILE: /run/bootstrap/device-response.json
      LINUXDO_DEVICE_TIMEOUT_SECONDS: "900"
      LINUXDO_DEVICE_RETRY_SECONDS: "10"
      LINUXDO_BYPARR_TIMEOUT_SECONDS: "180"
      LINUXDO_BROWSER_REQUEST_TIMEOUT_SECONDS: "30"
      PROXY_SERVER: http://host.docker.internal:7890
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1
      BROWSER_LOCALE: zh-CN
      STEALTHFOX_GEOIP_MMDB: /opt/byparr/geoip/geoip-aio-all.mmdb
    volumes:
      - ${LINUXDO_GEOIP_MMDB_FILE:?set LINUXDO_GEOIP_MMDB_FILE}:/opt/byparr/geoip/geoip-aio-all.mmdb:ro
      - ./runtime/bootstrap:/run/bootstrap

  linuxdo-session-login:
    profiles:
      - session-login
    build:
      context: ..
      dockerfile: sidecar/Dockerfile
      target: session-bootstrap
    container_name: linuxdo-session-login
    restart: "no"
    init: true
    user: "1000"
    shm_size: 512mb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LINUXDO_SECRET_FILE: /run/secrets/astrbot_plugin_linuxdo_preview.json
      LINUXDO_SESSION_STATE_FILE: /run/session/linuxdo-storage-state.json
      LINUXDO_SESSION_LOGIN_TIMEOUT_SECONDS: "1800"
      LINUXDO_BYPARR_TIMEOUT_SECONDS: "180"
      LINUXDO_BROWSER_REQUEST_TIMEOUT_SECONDS: "15"
      PROXY_SERVER: http://host.docker.internal:7890
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1
      BROWSER_LOCALE: zh-CN
      STEALTHFOX_GEOIP_MMDB: /opt/byparr/geoip/geoip-aio-all.mmdb
    ports:
      - "127.0.0.1:${LINUXDO_SESSION_VNC_PORT:-16080}:6080"
    volumes:
      - ${LINUXDO_GEOIP_MMDB_FILE:?set LINUXDO_GEOIP_MMDB_FILE}:/opt/byparr/geoip/geoip-aio-all.mmdb:ro
      - /AstrBot/data/secrets/astrbot_plugin_linuxdo_preview.json:/run/secrets/astrbot_plugin_linuxdo_preview.json:ro
      - ./runtime/session:/run/session

networks:
  astrbot:
    external: true
    name: REPLACE_WITH_ASTRBOT_DOCKER_NETWORK
