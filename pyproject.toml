[project]
name = "astrbot-plugin-linuxdo-preview"
version = "0.7.0"
description = "AstrBot QQ bounded-image preview plugin for public LINUX DO topics"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11.18", "Pillow>=11.2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
